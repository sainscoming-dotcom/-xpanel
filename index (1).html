<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио сайтов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8C%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#04050d;--fg:#eef0ff;--mut:#9aa0c8;--a:#8b5cf6;--b:#22d3ee;--card:rgba(20,22,48,.55);--line:rgba(139,92,246,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#17124a 0,var(--bg) 62%) fixed;color:var(--fg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.w{position:relative;z-index:1}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6vw}
.logo{font-weight:800;letter-spacing:.25em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{min-height:82vh;display:grid;place-items:center;text-align:center;padding:30px 6vw}
.orb{width:150px;height:150px;margin:0 auto 34px;perspective:800px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid var(--b);background:rgba(139,92,246,.12);box-shadow:inset 0 0 30px rgba(34,211,238,.35),0 0 24px rgba(139,92,246,.45)}
.cube i:nth-child(1){transform:translateZ(75px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(75px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(75px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(75px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
h1{font-size:clamp(40px,8vw,90px);line-height:1.05;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:200%}}
.hero p{color:var(--mut);max-width:540px;margin:18px auto 28px;font-size:18px}
.btn{display:inline-block;border:0;cursor:pointer;padding:13px 30px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;text-decoration:none;font:600 15px inherit;font-family:inherit;box-shadow:0 0 28px rgba(139,92,246,.55);transition:.3s}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 48px rgba(34,211,238,.65)}
.btn.g{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}
section{padding:60px 6vw 90px}
h2{text-align:center;font-size:clamp(28px,4vw,44px);margin-bottom:22px}
#filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:38px}
.chip{padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-size:14px;transition:.25s}
.chip.on,.chip:hover{color:#fff;background:rgba(139,92,246,.35)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px;max-width:1200px;margin:auto;perspective:1100px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;backdrop-filter:blur(12px);transform-style:preserve-3d;transition:transform .15s,box-shadow .3s;animation:up .7s both}
@keyframes up{from{opacity:0;translate:0 40px}}
.card:hover{box-shadow:0 0 44px rgba(139,92,246,.5)}
.pv{height:160px;display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden}
.pv b{transform:translateZ(50px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -8px}}
.bd{padding:22px;transform:translateZ(20px)}
.tag{font-size:12px;color:var(--b);letter-spacing:.12em;text-transform:uppercase}
.card h3{margin:6px 0 8px;font-size:22px}
.card p{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:16px;min-height:42px}
.card .btn{padding:9px 20px;font-size:14px}
.del{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;z-index:3}
.empty{text-align:center;color:var(--mut);grid-column:1/-1}
#adm{position:fixed;display:flex;gap:10px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
#dl{background:#0c0e26}
#modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(2,3,10,.75);backdrop-filter:blur(6px);padding:20px}
#modal.open{display:grid}
.box{width:min(440px,100%);background:#0c0e26;border:1px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:12px;box-shadow:0 0 60px rgba(139,92,246,.4)}
.box input,.box textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font:inherit}
.box textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end}
footer{text-align:center;padding:34px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="w">
<nav><div class="logo">PORTFOLIO</div><a class="btn g" href="#work">Проекты</a></nav>
<header class="hero"><div>
<div class="orb"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<h1>Мои сайты<br>в <span>космосе</span></h1>
<p>Коллекция моих проектов. Выбирай и заходи.</p>
<a class="btn" href="#work">Смотреть работы</a>
</div></header>
<section id="work"><h2>Проекты</h2><div id="filters"></div><div id="grid"></div></section>
<footer>© 2026 · Все проекты мои</footer>
</div>

<div id="adm"><button id="admin" class="btn" hidden>＋ Добавить сайт</button> <button id="dl" class="btn g" hidden>⬇ Скачать index.html</button></div>
<div id="modal"><div class="box">
<h3>Новый сайт</h3>
<input id="f-t" placeholder="Название">
<input id="f-u" placeholder="Ссылка (https://...)">
<input id="f-g" placeholder="Категория (например: Магазин)">
<input id="f-e" placeholder="Эмодзи (например: 🚀)" maxlength="4">
<textarea id="f-d" placeholder="Короткое описание"></textarea>
<div class="row"><button class="btn g" id="cancel">Отмена</button><button class="btn" id="save">Опубликовать</button></div>
</div></div>

<script id="data" type="application/json">[{"t":"Пример сайта","u":"https://example.com","g":"Магазин","e":"🚀","d":"Это пример карточки. Нажми «Добавить сайт», чтобы добавить свои проекты."}]</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);let owner=false,flt='Все';
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function render(){
const tags=['Все',...new Set(D.map(p=>p.g).filter(Boolean))];
const F=$('#filters');F.innerHTML='';
tags.forEach(t=>{const b=document.createElement('button');b.className='chip'+(t===flt?' on':'');b.textContent=t;b.onclick=()=>{flt=t;render()};F.appendChild(b)});
const G=$('#grid');G.innerHTML='';
const L=D.filter(p=>flt==='Все'||p.g===flt);
if(!L.length){G.innerHTML='<p class="empty">Пока пусто</p>';return}
L.forEach((p,i)=>{
const h=hue(p.t),c=document.createElement('div');c.className='card';c.style.animationDelay=i*.08+'s';
const pv=document.createElement('div');pv.className='pv';pv.style.background=`linear-gradient(135deg,hsl(${h} 70% 30%),hsl(${(h+60)%360} 70% 14%))`;
const em=document.createElement('b');em.textContent=p.e||'🌌';pv.appendChild(em);
const bd=document.createElement('div');bd.className='bd';
const tg=document.createElement('div');tg.className='tag';tg.textContent=p.g||'Сайт';
const t=document.createElement('h3');t.textContent=p.t;
const d=document.createElement('p');d.textContent=p.d||'';
const a=document.createElement('a');a.className='btn';a.textContent='Открыть сайт';a.href=/^https?:\/\//.test(p.u)?p.u:'#';a.target='_blank';a.rel='noopener';
bd.append(tg,t,d,a);c.append(pv,bd);
if(owner){const x=document.createElement('button');x.className='del';x.textContent='✕';x.title='Удалить';x.onclick=()=>{if(confirm('Удалить «'+p.t+'»?')){D.splice(D.indexOf(p),1);persist()}};c.appendChild(x)}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),X=(e.clientX-r.left)/r.width-.5,Y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${X*18}deg) rotateX(${-Y*18}deg)`});
c.addEventListener('mouseleave',()=>c.style.transform='');
G.appendChild(c)})}
function persist(){try{localStorage.setItem('pf_data',JSON.stringify(D))}catch(e){}render()}
function build(){
const cl=document.documentElement.cloneNode(true);
cl.querySelector('#data').textContent=JSON.stringify(D,null,1).replace(/</g,'\\u003c');
cl.querySelector('#grid').innerHTML='';cl.querySelector('#filters').innerHTML='';
cl.querySelector('#modal').classList.remove('open');cl.querySelector('#admin').hidden=true;cl.querySelector('#dl').hidden=true;
['f-t','f-u','f-g','f-e','f-d'].forEach(i=>{const e=cl.querySelector('#'+i);e.removeAttribute('value');e.textContent=''});
return '<!DOCTYPE html>\n'+cl.outerHTML}
function download(){const b=new Blob([build()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#admin').onclick=()=>$('#modal').classList.add('open');
$('#cancel').onclick=()=>$('#modal').classList.remove('open');
$('#save').onclick=()=>{
const t=$('#f-t').value.trim(),u=$('#f-u').value.trim();
if(!t||!/^https?:\/\//.test(u)){alert('Нужны название и ссылка, начинающаяся с https://');return}
D.unshift({t,u,g:$('#f-g').value.trim(),e:$('#f-e').value.trim(),d:$('#f-d').value.trim()});
$('#modal').classList.remove('open');persist()};
function admin(){if(location.hash!=='#admin')return;owner=true;
try{const L=JSON.parse(localStorage.getItem('pf_data')||'null');if(Array.isArray(L)){D.length=0;D.push(...L)}}catch(e){}
$('#admin').hidden=false;$('#dl').hidden=false;render()}
$('#dl').onclick=download;
addEventListener('hashchange',()=>location.reload());
render();admin();
const c=$('#stars'),x=c.getContext('2d');let W,H,S=[],mx=0,my=0;
function size(){W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:Math.min(280,W/5)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.3,t:Math.random()*6}))}
addEventListener('resize',size);size();
addEventListener('mousemove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
(function loop(){x.clearRect(0,0,W,H);for(const s of S){s.t+=.02;s.y+=s.z*.15;if(s.y>H){s.y=0;s.x=Math.random()*W}
x.globalAlpha=.4+.6*Math.abs(Math.sin(s.t));x.fillStyle=s.z>1.6?'#a5f3fc':'#fff';x.beginPath();x.arc(s.x-mx*s.z*30,s.y-my*s.z*30,s.z*.8,0,6.3);x.fill()}
requestAnimationFrame(loop)})();
</script>
</body>
</html>
