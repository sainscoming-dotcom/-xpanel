<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEVIL Tools</title>
<style>
:root{
--site-primary:#7657f6;
--site-secondary:#20213a;
--site-background:#0e1020;
--site-on-primary:#ffffff;
--site-on-secondary:#f5f4ff;
--site-on-background:#f4f3ff;
--panel:#171a30;
--panel2:#1d2039;
--muted:#a4a8c5;
--line:#303452;
--green:#4fd1a1;
--amber:#f2bf68;
--red:#f17b8b
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--site-background);
color:var(--site-on-background);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif
}
button,input,select{font:inherit}
.app{min-height:100vh;background:var(--site-background);overflow:hidden}
.top{
height:72px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 32px;
background:#121429
}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.7px}
.logo{
width:38px;height:38px;border-radius:12px;
background:linear-gradient(140deg,var(--site-primary),#a18aff);
display:grid;place-items:center;font-weight:900;color:white;
box-shadow:0 8px 28px #7657f644
}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:2px}
.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}
aside{background:#121429;border-right:1px solid var(--line);padding:24px 16px}
.nav-label{font-size:10px;color:#777d9f;font-weight:800;letter-spacing:1.7px;padding:12px 12px 8px}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;color:#b7bad2;cursor:pointer;margin:3px 0;font-size:14px}
.nav.active,.nav:hover{background:#292448;color:white}
.nav.active{box-shadow:inset 3px 0 var(--site-primary)}
.nav .ico{width:20px;text-align:center}
.main{padding:32px;max-width:1450px;width:100%;margin:auto}
.eyebrow{color:#a99aff;text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:800}
.heading{font-size:30px;font-weight:850;margin:8px 0 6px;letter-spacing:-.8px}
.sub{color:var(--muted);font-size:14px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}
.btn{border:0;border-radius:10px;background:var(--site-primary);color:white;padding:11px 16px;font-weight:750;cursor:pointer}
.btn.secondary{background:#292d4b;border:1px solid #3a3f63}
.btn:hover{filter:brightness(1.12)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px}
.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.stat-num{font-size:29px;font-weight:850;margin-top:13px}
.stat-note{font-size:11px;color:var(--green);margin-top:4px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.card-title{font-size:15px;font-weight:800;margin-bottom:16px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;min-width:500px}
th{font-size:10px;color:#858ba9;text-transform:uppercase;letter-spacing:1px;padding:11px 9px;border-bottom:1px solid var(--line)}
td{padding:14px 9px;border-bottom:1px solid #282b46;font-size:12px;color:#d8d9eb}
tr:last-child td{border:0}
.user{display:flex;align-items:center;gap:9px;font-weight:700}
.avatar{width:30px;height:30px;border-radius:9px;background:#34305a;color:#c7bbff;display:grid;place-items:center;font-size:11px}
.tag{font-size:10px;padding:5px 8px;border-radius:6px;background:#2d2850;color:#c6baff;display:inline-block}
.tag.green{background:#173b37;color:#70e0b8}
.tag.amber{background:#44351e;color:#f4cb7b}
.section{display:none}
.section.show{display:block}
.toolbar{display:flex;gap:10px;margin-bottom:15px}
.toolbar input,.field input,.field select{background:#11142a;border:1px solid var(--line);border-radius:9px;color:white;padding:11px 12px;outline:none}
.toolbar input{width:min(340px,100%)}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.role-card h3{margin:0 0 7px;font-size:14px}
.role-card p{margin:0 0 14px;color:var(--muted);font-size:11px}
.field{display:grid;gap:7px;margin:16px 0}
.field label{font-size:11px;color:#aeb2cd;font-weight:700}
.field input,.field select{width:100%}
.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:25px}
.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 25px 90px #0005}
.loginbox h1{font-size:25px;margin:10px 0}
.loginbox p{color:var(--muted);font-size:13px;line-height:1.6}
.hidden{display:none!important}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
aside{display:none}
.stats{grid-template-columns:repeat(2,1fr)}
.grid2{grid-template-columns:1fr}
.role-grid{grid-template-columns:repeat(2,1fr)}
.main{padding:22px}
.top{padding:0 18px}
}
@media(max-width:560px){
.stats{grid-template-columns:1fr 1fr;gap:8px}
.role-grid{grid-template-columns:1fr}
.main{padding:18px}
.heading{font-size:25px}
}
</style>
</head>
