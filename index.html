*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
color:#fff;
background:radial-gradient(circle at 50% 20%,#52117b,transparent 45%),linear-gradient(145deg,#08040f,#190b29,#08040f);
}
.container{
width:100%;
max-width:460px;
padding:40px 25px;
text-align:center;
background:rgba(25,10,40,.94);
border:1px solid #a64aff;
border-radius:25px;
box-shadow:0 0 45px #9b35e955;
animation:appear 1s ease;
}
@keyframes appear{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:translateY(0)}
}
.logo{
width:120px;height:120px;
margin:0 auto 22px;
border-radius:50%;

}
.subtitle{
margin-top:14px;
color:#c8b5d8;
font-size:14px;
line-height:1.8;
}
.line{
height:2px;width:70%;
margin:25px auto;
background:linear-gradient(90deg,transparent,#bd66ff,transparent);
}
.buttons{display:flex;flex-direction:column;gap:15px}
.btn{
display:block;
padding:18px;
border-radius:13px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(100deg,#7024a8,#a33ee9);
border:1px solid #c17aff;
transition:.3s;
box-shadow:0 0 15px #8c32c744;
}
.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 25px #b44dff;
}
.owner{background:linear-gradient(100deg,#261338,#492064)}
.info{
margin-top:28px;
color:#bba6cc;
font-size:13px;
line-height:1.9;
}
footer{
margin-top:25px;
color:#805a9c;
font-size:11px;
}
</style>
