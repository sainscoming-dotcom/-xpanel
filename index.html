<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Royale — Учёт выноса</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #1d3557 0%, transparent 35%),
        radial-gradient(circle at bottom right, #54206f 0%, transparent 35%),
        #090b12;
    color: #fff;
    min-height: 100vh;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.header p {
    color: #9da5b5;
    font-size: 15px;
}

/* Статистика */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(20, 24, 36, 0.9);
    border: 1px solid #252c3d;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.stat-title {
    color: #8f98aa;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 27px;
    font-weight: bold;
}

/* Карточка */

.card {
    background: rgba(16, 19, 29, 0.95);
    border: 1px solid #252c3d;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.card h2 {
    margin-bottom: 18px;
    font-size: 21px;
}

/* Форма */

.form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
}

input {
    width: 100%;
    padding: 14px 15px;
    background: #0d111a;
    border: 1px solid #30384b;
    border-radius: 11px;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 0 3px rgba(108,99,255,.12);
}

button {
    border: none;
    cursor: pointer;
    border-radius: 11px;
    padding: 13px 18px;
    font-size: 14px;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

.add-btn {
    background: linear-gradient(135deg, #5965ff, #884cff);
    color: white;
}

/* Панель */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 200px;
}

.clear-btn {
    background: #351b22;
    color: #ff8f9c;
    border: 1px solid #67303a;
}

/* Таблица */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    color: #8e98aa;
    text-align: left;
    font-size: 13px;
    padding: 13px 10px;
    border-bottom: 1px solid #292f3e;
}

td {
    padding: 15px 10px;
    border-bottom: 1px solid #202634;
    font-size: 14px;
}

tr:last-child td {
    border-bottom: none;
}

.amount {
    font-weight: bold;
    color: #72e6a3;
}

.actions {
    display: flex;
    gap: 7px;
}

.edit-btn {
    background: #252b40;
    color: #aeb7ff;
    padding: 8px 11px;
}

.delete-btn {
    background: #351b22;
    color: #ff8997;
    padding: 8px 11px;
}

.empty {
    text-align: center;
    padding: 35px 10px;
    color: #747d90;
}

/* Модальное окно */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 450px;
    background: #121620;
    border: 1px solid #30384b;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.modal-box h2 {
    margin-bottom: 18px;
}

.modal-box input {
    margin-bottom: 12px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.save-btn {
    background: #5865f2;
    color: white;
}

.cancel-btn {
    background: #292f3d;
    color: #ccd2df;
}

/* Адаптив */

@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .form {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 26px;
    }

    .card {
        padding: 16px;
    }

    th,
    td {
        white-space: nowrap;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎒 Metro Royale</h1>
        <p>Учёт выноса с каждой катки PUBG</p>
    </div>

    <!-- Статистика -->

    <div class="stats">

        <div class="stat">
            <div class="stat-title">💰 Общий вынос</div>
            <div class="stat-value" id="totalAmount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">🎮 Всего каток</div>
            <div class="stat-value" id="gamesCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">📈 Средний вынос</div>
            <div class="stat-value" id="averageAmount">0</div>
        </div>

    </div>

    <!-- Добавление -->

    <div class="card">

        <h2>➕ Добавить катку</h2>

        <div class="form">

            <input
                type="number"
                id="amountInput"
                placeholder="Вынос за катку"
                min="0"
                step="1"
            >

            <input
                type="text"
                id="noteInput"
                placeholder="Комментарий, например: Хорошая катка"
            >

            <button class="add-btn" onclick="addGame()">
                Добавить
            </button>

        </div>

    </div>

    <!-- История -->

    <div class="card">

        <h2>📋 История каток</h2>

        <div class="toolbar">

            <input
                class="search"
                id="searchInput"
                type="text"
                placeholder="🔎 Поиск по записям..."
                oninput="renderGames()"
            >

            <button class="clear-btn" onclick="clearAll()">
                🗑 Очистить всё
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Дата</th>
                        <th>Вынос</th>
                        <th>Комментарий</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="gamesTable"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- Окно редактирования -->

<div class="modal" id="editModal">

    <div class="modal-box">

        <h2>✏️ Изменить катку</h2>

        <input
            type="number"
            id="editAmount"
            placeholder="Вынос"
            min="0"
        >

        <input
            type="text"
            id="editNote"
            placeholder="Комментарий"
        >

        <div class="modal-buttons">

            <button class="cancel-btn" onclick="closeModal()">
                Отмена
            </button>

            <button class="save-btn" onclick="saveEdit()">
                Сохранить
            </button>

        </div>

    </div>

</div>


<script>

let games = JSON.parse(localStorage.getItem("metroRoyaleGames")) || [];

let editingId = null;


/* Сохранение */

function saveData() {
    localStorage.setItem(
        "metroRoyaleGames",
        JSON.stringify(games)
    );
}


/* Добавление катки */

function addGame() {

    const amountInput = document.getElementById("amountInput");
    const noteInput = document.getElementById("noteInput");

    const amount = Number(amountInput.value);
    const note = noteInput.value.trim();

    if (!amountInput.value || amount < 0) {
        alert("Введите сумму выноса.");
        return;
    }

    const game = {
        id: Date.now(),
        amount: amount,
        note: note || "Без комментария",
        date: new Date().toLocaleString("ru-RU")
    };

    games.unshift(game);

    saveData();

    amountInput.value = "";
    noteInput.value = "";

    renderGames();
}


/* Отображение */

function renderGames() {

    const table = document.getElementById("gamesTable");
    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    table.innerHTML = "";

    let filteredGames = games.filter(game => {

        return (
            game.note.toLowerCase().includes(search) ||
            String(game.amount).includes(search) ||
            game.date.toLowerCase().includes(search)
        );

    });

    if (filteredGames.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Пока нет записей
                </td>
            </tr>
        `;

    } else {

        filteredGames.forEach((game, index) => {

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${index + 1}</td>

                <td>${game.date}</td>

                <td class="amount">
                    ${formatNumber(game.amount)}
                </td>

                <td>
                    ${escapeHTML(game.note)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="openEdit(${game.id})"
                        >
                            ✏️
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteGame(${game.id})"
                        >
                            🗑
                        </button>

                    </div>

                </td>
            `;

            table.appendChild(row);

        });

    }

    updateStats();
}


/* Статистика */

function updateStats() {

    const total = games.reduce(
        (sum, game) => sum + Number(game.amount),
        0
    );

    const count = games.length;

    const average = count > 0
        ? total / count
        : 0;

    document.getElementById("totalAmount").textContent =
        formatNumber(total);

    document.getElementById("gamesCount").textContent =
        count;

    document.getElementById("averageAmount").textContent =
        formatNumber(Math.round(average));
}


/* Форматирование числа */

function formatNumber(number) {

    return Number(number).toLocaleString("ru-RU");

}


/* Удаление */

function deleteGame(id) {

    const game = games.find(g => g.id === id);

    if (!game) return;

    if (
        !confirm(
            `Удалить катку с выносом ${formatNumber(game.amount)}?`
        )
    ) {
        return;
    }

    games = games.filter(g => g.id !== id);

    saveData();

    renderGames();
}


/* Открытие редактирования */

function openEdit(id) {

    const game = games.find(g => g.id === id);

    if (!game) return;

    editingId = id;

    document.getElementById("editAmount").value =
        game.amount;

    document.getElementById("editNote").value =
        game.note;

    document
        .getElementById("editModal")
        .classList.add("active");
}


/* Сохранение редактирования */

function saveEdit() {

    const amount =
        Number(document.getElementById("editAmount").value);

    const note =
        document.getElementById("editNote").value.trim();

    if (!amount || amount < 0) {

        alert("Введите сумму выноса.");

        return;
    }

    const game = games.find(
        g => g.id === editingId
    );

    if (!game) return;

    game.amount = amount;

    game.note =
        note || "Без комментария";

    saveData();

    closeModal();

    renderGames();
}


/* Закрытие окна */

function closeModal() {

    editingId = null;

    document
        .getElementById("editModal")
        .classList.remove("active");
}


/* Очистить всё */

function clearAll() {

    if (games.length === 0) {

        alert("Записей пока нет.");

        return;
    }

    if (
        !confirm(
            "Точно удалить ВСЕ записи?"
        )
    ) {
        return;
    }

    games = [];

    saveData();

    renderGames();
}


/* Защита текста */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* Закрытие модального окна */

document
    .getElementById("editModal")
    .addEventListener("click", function(e) {

        if (e.target === this) {
            closeModal();
        }

    });


/* Enter для добавления */

document
    .getElementById("amountInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            addGame();
        }

    });


document
    .getElementById("noteInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            addGame();
        }

    });


/* Первый запуск */

renderGames();

</script>

</body>
</html>
