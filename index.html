<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РАДАР СТАРОЇ</title>
<meta name="description" content="Офіційна сторінка Telegram-каналу РАДАР СТАРОЇ">
<meta name="theme-color" content="#05030d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --space:#05030d; --deep:#12062a; --violet:#8b3dff; --magenta:#d04bff; --cyan:#5ce1ff; --text:#f1e8ff; --muted:#b9a6d6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  font-family:'Manrope',system-ui,Arial,sans-serif; color:var(--text); background:var(--space);
  overflow-x:hidden; position:relative;
}
/* туманності */
body::before{
  content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 20% 15%,rgba(139,61,255,.45),transparent 70%),
    radial-gradient(ellipse 45% 40% at 85% 30%,rgba(208,75,255,.28),transparent 70%),
    radial-gradient(ellipse 60% 45% at 50% 100%,rgba(92,225,255,.16),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.08)}}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.card{
  position:relative; z-index:1; width:100%; max-width:440px; padding:44px 26px 28px; text-align:center;
  background:linear-gradient(160deg,rgba(40,16,76,.62),rgba(10,5,24,.78));
  border:1px solid rgba(190,120,255,.35); border-radius:28px;
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 80px rgba(0,0,0,.6),0 0 70px rgba(139,61,255,.28);
  animation:appear 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes appear{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

/* радар-логотип */
.radar{
  position:relative; width:150px; height:150px; margin:0 auto 26px; border-radius:50%;
  background:
    radial-gradient(circle,rgba(92,225,255,.18) 0 2px,transparent 3px),
    repeating-radial-gradient(circle,transparent 0 22px,rgba(92,225,255,.28) 22px 23px),
    radial-gradient(circle,#1d0b3d,#07030f 72%);
  border:2px solid rgba(92,225,255,.55);
  box-shadow:0 0 35px rgba(92,225,255,.35),0 0 70px rgba(139,61,255,.45),inset 0 0 30px rgba(139,61,255,.5);
}
.radar::before{ /* перехрестя */
  content:""; position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(rgba(92,225,255,.25),rgba(92,225,255,.25)) center/1px 100% no-repeat,
             linear-gradient(rgba(92,225,255,.25),rgba(92,225,255,.25)) center/100% 1px no-repeat;
}
.sweep{
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,rgba(92,225,255,0) 0deg,rgba(92,225,255,0) 250deg,rgba(92,225,255,.55) 358deg,#bff3ff 360deg);
  animation:spin 3.6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{
  position:absolute; width:7px; height:7px; border-radius:50%; background:#fff;
  box-shadow:0 0 10px 3px var(--cyan); opacity:0; animation:blip 3.6s linear infinite;
}
.b1{top:30%;left:64%;animation-delay:.2s}
.b2{top:66%;left:34%;animation-delay:1.9s}
.b3{top:42%;left:24%;animation-delay:2.9s}
@keyframes blip{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1.3)}40%{opacity:0;transform:scale(1)}100%{opacity:0}}
.orbit{
  position:absolute; inset:-16px; border-radius:50%; border:1px dashed rgba(208,75,255,.45);
  animation:spin 26s linear infinite reverse;
}
.orbit::after{
  content:""; position:absolute; top:-5px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%;
  background:var(--magenta); box-shadow:0 0 14px 4px var(--magenta);
}

h1{
  font-family:'Unbounded','Arial Black',sans-serif; font-weight:700; font-size:clamp(25px,7.4vw,32px);
  line-height:1.2; letter-spacing:.04em;
  background:linear-gradient(95deg,#fff 10%,#e3b6ff 45%,#8fe9ff 95%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 18px rgba(176,92,255,.6));
}
.subtitle{margin-top:16px;color:var(--muted);font-size:15px;line-height:1.7}
.line{height:1px;width:72%;margin:26px auto;background:linear-gradient(90deg,transparent,var(--magenta),var(--cyan),transparent)}

.buttons{display:flex;flex-direction:column;gap:14px}
.btn{
  position:relative; display:flex; align-items:center; justify-content:center; gap:10px; overflow:hidden;
  padding:18px 16px; border-radius:16px; text-decoration:none; font-weight:600; font-size:15px; letter-spacing:.06em;
  color:#fff; background:linear-gradient(100deg,#6a22c9,#b043f5); border:1px solid rgba(220,170,255,.6);
  box-shadow:0 8px 28px rgba(139,61,255,.45);
  transition:transform .3s,box-shadow .3s;
}
.btn::after{ /* блиск */
  content:""; position:absolute; top:0; left:-70%; width:50%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); transform:skewX(-20deg); transition:left .7s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-4px);box-shadow:0 12px 38px rgba(176,67,245,.75),0 0 0 1px rgba(255,255,255,.2)}
.btn:hover::after,.btn:focus-visible::after{left:130%}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn svg{width:20px;height:20px;flex:none}
.chat{background:linear-gradient(100deg,#3a2bb8,#2f8fd8);border-color:rgba(140,225,255,.6);box-shadow:0 8px 28px rgba(60,150,230,.4)}
.chat:hover,.chat:focus-visible{box-shadow:0 12px 38px rgba(92,200,255,.6),0 0 0 1px rgba(255,255,255,.2)}
.owner{background:linear-gradient(100deg,rgba(35,15,66,.9),rgba(70,30,120,.9));border-color:rgba(92,225,255,.5);box-shadow:0 8px 28px rgba(92,225,255,.18)}
.owner:hover,.owner:focus-visible{box-shadow:0 12px 38px rgba(92,225,255,.4)}

.info{margin-top:28px;color:var(--muted);font-size:14px;line-height:1.8}
footer{margin-top:22px;padding-top:16px;border-top:1px solid rgba(190,120,255,.18);color:#8a6aad;font-size:11px;letter-spacing:.05em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .blip{opacity:.8}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="card">
  <div class="radar" aria-hidden="true">
    <div class="sweep"></div>
    <span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span>
    <div class="orbit"></div>
  </div>

  <h1>РАДАР СТАРОЇ</h1>

  <p class="subtitle">
    Офіційна сторінка Telegram-каналу<br>
    🇺🇦 Інформація • Сповіщення • Новини
  </p>

  <div class="line"></div>

  <nav class="buttons">
    <a class="btn" href="https://t.me/+NwMc1WkQK3JlODNi" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      ПЕРЕЙТИ ДО КАНАЛУ
    </a>
    <a class="btn chat" href="https://t.me/+Uv95vAYfrkVmZTFi" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.600 7.100L3 20.500l1.500-4.800A8 8 0 1 1 21 12z"/><path d="M8.500 11h7M8.500 14.500h4"/></svg>
      ЧАТ СПІЛЬНОТИ
    </a>
    <a class="btn owner" href="https://t.me/naisti" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      ЗВ’ЯЗОК ІЗ ВЛАСНИКОМ
    </a>
  </nav>

  <p class="info">
    💜 Дякуємо, що ви з нами!<br>
    Бережіть себе та своїх близьких 🇺🇦
  </p>

  <footer>© 2026 РАДАР СТАРОЇ | УСІ ПРАВА ЗАХИЩЕНО</footer>
</main>

<script>
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),W,H,stars=[],shoots=[];
  var still=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){
    var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
    c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    var n=Math.min(260,Math.floor(W*H/6500));stars=[];
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28,s:Math.random()*.02+.005,v:Math.random()*.12+.02});
  }
  function frame(){
    x.clearRect(0,0,W,H);
    stars.forEach(function(s){
      s.p+=s.s;s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}
      x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));
      x.fillStyle=s.r>1.1?'#cfe9ff':'#fff';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();
    });
    if(!still&&Math.random()<.008&&shoots.length<2)shoots.push({x:Math.random()*W,y:Math.random()*H*.5,l:0});
    shoots=shoots.filter(function(m){
      m.x-=9;m.y+=5;m.l++;
      var g=x.createLinearGradient(m.x,m.y,m.x+70,m.y-39);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.6;
      x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+70,m.y-39);x.stroke();
      return m.l<60;
    });
    if(!still)requestAnimationFrame(frame);
  }
  addEventListener('resize',size);size();frame();
})();
</script>
</body>
</html>
