<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Журнал прибыли</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#090f22,#17163b,#29134d);color:#fff;padding:25px 15px}
.container{max-width:1150px;margin:auto}
.panel{background:rgba(15,21,48,.94);border:1px solid #39457a;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 6px;font-size:34px}.desc{color:#aeb8d8;margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.card{background:#111a38;border:1px solid #2e3a67;border-radius:14px;padding:15px}
.card small{display:block;color:#929fc6;margin-bottom:7px}.card b{font-size:25px}
.green b{color:#43e59b}.red b{color:#ff6f86}.purple b{color:#b99cff}
.form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:15px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #3a4775;background:#0e1630;color:#fff;outline:none}
button{border:0;border-radius:10px;padding:12px 16px;color:#fff;font-weight:bold;cursor:pointer}
.add{background:linear-gradient(90deg,#386ee8,#7655ff)}.save{background:#16805e}.clear{background:#b53750}
.table{overflow:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:850px;background:#0d1530}
th,td{padding:11px;border-bottom:1px solid #273355;text-align:left}
th{background:#171f40;color:#b7c2e3;font-size:13px}
.income{color:#43e59b}.expense{color:#ff7187}
.delete{background:#70283d;padding:7px 10px}
.status{height:22px;color:#9eacd3;margin-top:13px;font-size:14px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<div class="panel">
<h1>💰 Журнал прибыли</h1>
<div class="desc">Каждая операция автоматически записывается с датой и временем.</div>

<div class="cards">
<div class="card green"><small>Всего доходов</small><b id="income">0 ₴</b></div>
<div class="card red"><small>Всего расходов</small><b id="expense">0 ₴</b></div>
<div class="card purple"><small>Чистая прибыль</small><b id="profit">0 ₴</b></div>
</div>

<div class="form">
<input id="category" placeholder="Категория">
<select id="type"><option value="income">Доход</option><option value="expense">Расход</option></select>
<input id="amount" type="number" min="0" step="0.01" placeholder="Сумма ₴">
<input id="comment" placeholder="Комментарий">
</div>

<button class="add" onclick="addOperation()">+ Добавить и записать</button>
<button class="save" onclick="save()">💾 Сохранить</button>
<button class="clear" onclick="clearHistory()">🗑 Очистить историю</button>

<div class="table" style="margin-top:18px">
<table>
<thead><tr><th>#</th><th>Дата и время</th><th>Тип</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead>
<tbody id="log"></tbody>
</table>
</div>
<div class="status" id="status"></div>
</div>
</div>

<script>
const KEY='xpanel_profit_log_v2';
let operations=JSON.parse(localStorage.getItem(KEY)||'[]');

function formatMoney(n){
 return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(n)+' ₴';
}
function now(){
 return new Date().toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'medium'});
}
function addOperation(){
 const category=document.getElementById('category').value.trim()||'Без категории';
 const type=document.getElementById('type').value;
 const amount=parseFloat(document.getElementById('amount').value);
 const comment=document.getElementById('comment').value.trim()||'—';
 if(!amount || amount<=0){notice('⚠️ Введи сумму.');return}
 operations.push({time:now(),type,category,amount,comment});
 localStorage.setItem(KEY,JSON.stringify(operations));
 document.getElementById('amount').value='';
 document.getElementById('comment').value='';
 render();
 notice('✅ Операция добавлена в журнал.');
}
function removeOperation(i){
 operations.splice(i,1);
 localStorage.setItem(KEY,JSON.stringify(operations));
 render();
 notice('🗑 Запись удалена.');
}
function render(){
 const log=document.getElementById('log');
 log.innerHTML='';
 let income=0,expense=0;
 operations.forEach((x,i)=>{
   if(x.type==='income') income+=x.amount; else expense+=x.amount;
   const tr=document.createElement('tr');
   tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(x.time)}</td>
   <td class="${x.type==='income'?'income':'expense'}">${x.type==='income'?'Доход':'Расход'}</td>
   <td>${escapeHtml(x.category)}</td><td>${formatMoney(x.amount)}</td>
   <td>${escapeHtml(x.comment)}</td><td><button class="delete" onclick="removeOperation(${i})">Удалить</button></td>`;
   log.appendChild(tr);
 });
 document.getElementById('income').textContent=formatMoney(income);
 document.getElementById('expense').textContent=formatMoney(expense);
 document.getElementById('profit').textContent=formatMoney(income-expense);
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(operations));
 notice('💾 Журнал сохранён.');
}
function clearHistory(){
 if(!confirm('Удалить всю историю операций?')) return;
 operations=[];
 localStorage.removeItem(KEY);
 render();
 notice('🗑 История очищена.');
}
function notice(t){
 document.getElementById('status').textContent=t;
 setTimeout(()=>document.getElementById('status').textContent='',2500);
}
function escapeHtml(s){
 return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
render();
</script>
</body>
</html>
